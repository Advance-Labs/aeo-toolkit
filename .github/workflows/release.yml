# Publishes the public @advance-labs/* packages via Changesets.
#
# On a push to main, this opens (or updates) a "Version Packages" PR collecting the
# pending changesets. Merging THAT PR is what publishes — so a release is always a
# deliberate, reviewable act rather than a side effect of landing a feature.
#
# Inert until the NPM_TOKEN secret exists. Create a granular access token on npm with
# write access to the @advance-labs scope, then add it under
# Settings > Secrets and variables > Actions.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets diffs against the base branch

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Publish only what the full gate has passed. A broken release is worse than a late one.
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
