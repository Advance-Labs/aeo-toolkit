# Scheduled + manual run of the autonomous blogging agent (Tool 9).
#
# Secrets are passed ONLY through the `env:` map sourced from `${{ secrets.* }}` — they are NEVER
# inlined into `run:` steps. BYOK keys are request-scoped inside the process and are never persisted
# or logged by the agent. Canonical source: apps/blogging-agent/deploy/blogging-agent.yml.

name: blogging-agent

on:
  schedule:
    - cron: '0 13 * * *' # daily at 13:00 UTC
  workflow_dispatch: {}

# Prevent overlapping runs from racing on the shared post store.
concurrency:
  group: blogging-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only needed when committing the JSON post-store fallback back to the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @aeo/blogging-agent build

      - name: Run the agent
        env:
          # LLM (BYOK, request-scoped). Groq for bulk drafting; one reasoning key for strategy.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Google (GSC + GA4 reads).
          GOOGLE_ACCESS_TOKEN: ${{ secrets.GOOGLE_ACCESS_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          # Durable post store (Supabase). Omit to use the ephemeral JSON-file fallback.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Publishing (omit PUBLISH_WEBHOOK_URL to run in dry-run mode).
          PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}
          PUBLISH_WEBHOOK_TOKEN: ${{ secrets.PUBLISH_WEBHOOK_TOKEN }}
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: node apps/blogging-agent/dist/run.js

      - name: Persist post store (JSON-store fallback only)
        if: always()
        run: |
          if [ -f apps/blogging-agent/data/posts.json ]; then
            git config user.name "blogging-agent"
            git config user.email "actions@users.noreply.github.com"
            git add apps/blogging-agent/data/posts.json || true
            git commit -m "chore(blogging-agent): update post store" || echo "no changes"
            git push || echo "nothing to push"
          else
            echo "no JSON post store to persist (Supabase store in use)"
          fi
